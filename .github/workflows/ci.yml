name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    # Blacksmith runner. Its colocated cache backs actions/cache, so setup-go's
    # module and build cache below is restored from Blacksmith, not GitHub.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "stable"]
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      # Tests run on Linux only. Cross-vetting (which type-checks the test
      # files too) keeps the darwin and windows builds honest.
      - name: go vet (darwin, windows)
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: go test
        run: go test -race ./...
        env:
          # Live tests run only when these secrets are configured.
          PERMIO_TEST_API_KEY: ${{ secrets.PERMIO_TEST_API_KEY }}
          PERMIO_TEST_API_URL: ${{ secrets.PERMIO_TEST_API_URL }}

  goreleaser-check:
    name: GoReleaser config
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned so a new GoReleaser release can't fail CI with fresh
          # deprecations. Keep in sync with release.yml.
          version: v2.19.0
          args: check

  npm-wrapper:
    name: npm wrapper
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: npm
