name: Release

# Builds binaries for darwin/linux/windows (amd64, arm64) with checksums and
# creates a DRAFT GitHub release when a v* tag is pushed. Publish the draft by
# hand. The Homebrew cask is pushed to PrivateJAR/homebrew-tap only when the
# HOMEBREW_TAP_GITHUB_TOKEN secret is set.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # Blacksmith's checkout keeps a git mirror on a sticky disk, which makes
      # the full-history fetch GoReleaser needs cheap on warm runs.
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
      # Module and build cache (served by Blacksmith's cache) speeds up the
      # cross-compiles and the `go test` before-hook.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned; keep in sync with ci.yml.
          version: v2.19.0
          args: release --clean ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN == '' && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
